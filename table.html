<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product table</title>
    <style>
        table {
            margin: auto;
            border-collapse: collapse;
        }
        table, td, th {
            border: 2px solid black ;
            width: 600px;
            text-align: center;
            background-color: grey;
            color: white;
        }
        th {
            height: 50px;
            font-size: 125%;
        }
        td {
            height: 30px;
        }

        .button {
            display: inline-block;
            margin: 48px 700px;
            background-color: rgb(12, 87, 149);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 15px;
        }
        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Product table -->
    <table>
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Wireless Keyboard</td>
            <td>4500 rs</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Wireless Mouse</td>
            <td>2800 rs</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Smart Watch</td>
            <td>10500 rs</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Power Bank</td>
            <td>8800 rs</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Wired Earphones</td>
            <td>1500 rs</td>
        </tr>
    </table>

    <!-- Button Link -->
    <a href="https://content.time.com/time/specials/packages/completelist/0,29569,2023689,00.html" class="button">View More</a>
</body>
</html>
